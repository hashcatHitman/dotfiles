name: Bash

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["**"]
  workflow_dispatch: {}

permissions: {}

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

defaults:
  run:
    shell: bash

jobs:
  shellfmt:
    name: Format Check
    runs-on: ubuntu-latest
    container:
      # Dependabot doesn't suppport updating this yet.
      # See: https://github.com/dependabot/dependabot-core/issues/5819
      # To update manually, check: https://hub.docker.com/r/mvdan/shfmt/tags
      image: mvdan/shfmt:v3.14.1-alpine@sha256:c7a0dfa73dfea80e9d9e185c655b44759eea2df85dec142295bcc0bb600c6266
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install `bash`
        run: apk update && apk add bash
        shell: sh
      - name: Run `shfmt`
        run: shopt -s dotglob globskipdots globstar && FORCE_COLOR=1 shfmt -i 4 -d **/*.{bash,bashrc,bash_{profile,logout}}

  shellcheck:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Run `shellcheck`
        run: shopt -s dotglob globskipdots globstar && shellcheck **/*.{bash,bashrc,bash_{profile,logout}}
